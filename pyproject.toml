[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-cli"
dynamic = ["version"]
description = "Galaxy bioinformatics CLI for automating histories, datasets, tools, workflows, and jobs via the Galaxy REST API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Junhao Qiu" },
]
keywords = [
    "Galaxy",
    "bioinformatics",
    "CLI",
    "workflow automation",
    "REST API",
    "genomics",
    "research software",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "prompt-toolkit>=3.0.0",
    "requests>=2.28.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
galaxy-cli = "galaxy_cli.cli:main"

[project.urls]
Homepage = "https://qchiujunhao.github.io/galaxy-cli/"
Documentation = "https://qchiujunhao.github.io/galaxy-cli/"
Source = "https://github.com/qchiujunhao/galaxy-cli"
Issues = "https://github.com/qchiujunhao/galaxy-cli/issues"
Changelog = "https://github.com/qchiujunhao/galaxy-cli/releases"

[tool.setuptools.packages.find]
include = ["galaxy_cli*"]

[tool.setuptools.package-data]
"galaxy_cli" = ["skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["galaxy_cli/tests"]

[tool.setuptools_scm]
