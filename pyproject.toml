[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-cli"
dynamic = ["version"]
description = "CLI harness for the Galaxy bioinformatics platform"
readme = "README.md"
license = "MIT"
authors = [
    { name = "cli-anything" },
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "prompt-toolkit>=3.0.0",
    "requests>=2.28.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
galaxy-cli = "galaxy_cli.cli:main"

[tool.setuptools.packages.find]
include = ["galaxy_cli*"]

[tool.setuptools.package-data]
"galaxy_cli" = ["skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["galaxy_cli/tests"]

[tool.setuptools_scm]
